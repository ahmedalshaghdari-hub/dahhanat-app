const{useState,useEffect,useMemo,useCallback,createContext,useContext}=React;

/* ══ CONFIG ══════════════════════════════════ */
const GH_OWNER="ahmedalshaghdari-hub";
const GH_REPO="dahhanat-db";
const TOKEN_KEY="pnt_ghtoken_v1";
let _sha=null,_cache=null,_writing=false,_queue=[];
function getToken(){return localStorage.getItem(TOKEN_KEY)||'';}
function setToken(t){localStorage.setItem(TOKEN_KEY,t);}

/* ══ GITHUB SYNC ══════════════════════════════ */
async function ghRead(){
  const t=getToken();if(!t)throw new Error('no token');
  const ctrl=new AbortController();
  const timer=setTimeout(()=>ctrl.abort(),12000); // 12s timeout
  let r;
  try{r=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/data.json`,
    {headers:{Authorization:`Bearer ${t}`,Accept:'application/vnd.github.v3+json'},signal:ctrl.signal});}
  finally{clearTimeout(timer);}
  if(!r.ok)throw new Error('read '+r.status);
  const f=await r.json();
  _sha=f.sha;
  _cache=JSON.parse(decodeURIComponent(escape(atob(f.content.replace(/\s/g,'')))));
  if(!_cache.capital)_cache.capital={};if(!_cache.returns)_cache.returns={};
  return _cache;
}
async function ghWrite(updater){
  return new Promise((res,rej)=>{_queue.push({updater,res,rej});processQ();});
}
async function processQ(){
  if(_writing||!_queue.length)return;
  _writing=true;
  const{updater,res,rej}=_queue.shift();
  try{
    const data=_cache?JSON.parse(JSON.stringify(_cache)):await ghRead();
    if(!data.capital)data.capital={};if(!data.returns)data.returns={};
    updater(data);data.ts=Date.now();
    const content=btoa(unescape(encodeURIComponent(JSON.stringify(data))));
    const r=await fetch(`https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/data.json`,{
      method:'PUT',
      headers:{Authorization:`Bearer ${getToken()}`,Accept:'application/vnd.github.v3+json','Content-Type':'application/json'},
      body:JSON.stringify({message:'sync',content,sha:_sha})
    });
    if(r.status===409){await ghRead();_writing=false;_queue.unshift({updater,res,rej});return processQ();}
    if(!r.ok)throw new Error('write '+r.status);
    const result=await r.json();
    _sha=result.content.sha;_cache=data;res(data);
  }catch(e){rej(e);}finally{_writing=false;processQ();}
}

/* ══ CONSTANTS ════════════════════════════════ */
const PARTNERS=[
  {id:'mk',name:'محمد خالد',pct:.40,color:'#1D4ED8',bg:'#EFF6FF',border:'#BFDBFE'},
  {id:'as',name:'علي سعيد', pct:.40,color:'#047857',bg:'#ECFDF5',border:'#A7F3D0'},
  {id:'car',name:'السيارة',  pct:.20,color:'#92400E',bg:'#FFFBEB',border:'#FCD34D'},
];
const ADMIN_TABS=[
  {id:0,ico:'🏠',lbl:'الرئيسية'},{id:1,ico:'📦',lbl:'المنتجات'},
  {id:2,ico:'💰',lbl:'المبيعات'},{id:3,ico:'📊',lbl:'المصاريف'},
  {id:4,ico:'🏦',lbl:'الصناديق'},{id:8,ico:'💼',lbl:'رأس المال'},
  {id:5,ico:'📅',lbl:'التقارير'},{id:9,ico:'↩️',lbl:'المرتجعات'},{id:6,ico:'📈',lbl:'الأرباح'},
  {id:7,ico:'⚙️',lbl:'الإعدادات'},
];
const SALES_TABS=[
  {id:1,ico:'📦',lbl:'المنتجات'},{id:2,ico:'💰',lbl:'المبيعات'},
  {id:3,ico:'📊',lbl:'المصاريف'},{id:4,ico:'🏦',lbl:'الصناديق'},
  {id:9,ico:'↩️',lbl:'المرتجعات'},
];
const CATS=['دهانات','أدوات','كيماويات','مواد بناء','أخرى'];
const MN=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
const AuthCtx=createContext(null);

/* ══ HELPERS ══════════════════════════════════ */
const fmt=n=>(+(n)||0).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2});
const today=()=>new Date().toISOString().split('T')[0];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const mk=d=>(d||'').slice(0,7);
const mName=k=>{if(!k)return'';const[y,m]=k.split('-');return`${MN[+m-1]} ${y}`;};
function notify(msg){const el=document.getElementById('notif');if(!el)return;el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2500);}

const calcFin=(sales,expenses,withdrawals,returns=[],mFilter=null)=>{
  const f=mFilter?x=>mk(x.date)===mFilter:()=>true;
  const s=sales.filter(f),e=expenses.filter(f),w=withdrawals.filter(f),rt=returns.filter(f);
  const retRev=rt.reduce((a,x)=>a+(x.totalRefund||0),0);const retCost=rt.reduce((a,x)=>a+(x.totalCost||0),0);
  const totalSales=Math.max(0,s.reduce((a,x)=>a+(x.total||0),0)-retRev);
  const totalCost=Math.max(0,s.reduce((a,x)=>a+(x.cost||0),0)-retCost);
  const gross=totalSales-totalCost;
  const fuel=e.filter(x=>x.type==='fuel').reduce((a,x)=>a+(x.amount||0),0);
  const other=e.filter(x=>x.type!=='fuel').reduce((a,x)=>a+(x.amount||0),0);
  const net=gross-fuel-other;
  const partners=PARTNERS.map(p=>{
    const share=net*p.pct;
    const drawn=w.filter(x=>x.pid===p.id).reduce((a,x)=>a+(x.amount||0),0);
    return{...p,share,drawn,balance:share-drawn};
  });
  return{totalSales,totalCost,gross,fuel,other,net,partners,count:s.length};
};

/* ══ EXCEL EXPORT ══════════════════════════════ */
const exportExcel=(products,sales,expenses,withdrawals,capital,returns=[])=>{
  const wb=XLSX.utils.book_new();
  const add=(name,rows)=>{if(rows.length){const ws=XLSX.utils.json_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,name);}};

  // Sheet 1: Products
  add('المنتجات',products.map(p=>({'الاسم':p.name,'الفئة':p.cat,'الوحدة':p.unit,'سعر الشراء':+p.buyP||0,'سعر البيع':+p.sellP||0,'المخزون':+p.stock||0,'هامش الربح %':p.buyP>0?+((p.sellP-p.buyP)/p.buyP*100).toFixed(1):0})));

  // Sheet 2: Sales summary
  const ss=[...sales].sort((a,b)=>a.date.localeCompare(b.date));
  add('المبيعات',ss.map(s=>({'التاريخ':s.date,'ملاحظة':s.note||'','الإجمالي':+s.total||0,'التكلفة':+s.cost||0,'الربح':+s.profit||0})));

  // Sheet 3: Sale items detail
  const det=[];
  ss.forEach(s=>(s.items||[]).forEach(it=>det.push({'التاريخ':s.date,'المنتج':it.pname||'','الكمية':+it.qty,'سعر البيع':+it.sellP,'الإجمالي':(+it.qty)*(+it.sellP),'الربح':(+it.qty)*((+it.sellP)-(+it.buyP))})));
  add('تفاصيل المبيعات',det);

  // Sheet 4: Expenses
  add('المصاريف',[...expenses].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>({'التاريخ':e.date,'النوع':e.type==='fuel'?'وقود':'عام','الوصف':e.desc,'المبلغ':+e.amount||0})));

  // Sheet 5: Withdrawals
  add('السحوبات',[...withdrawals].sort((a,b)=>a.date.localeCompare(b.date)).map(w=>{const p=PARTNERS.find(x=>x.id===w.pid);return{'التاريخ':w.date,'الشريك':p?.name||w.pid,'المبلغ':+w.amount||0,'ملاحظة':w.note||''};}));

  // Sheet 6: Capital
  add('رأس المال',[...capital].sort((a,b)=>a.date.localeCompare(b.date)).map(c=>{const p=PARTNERS.find(x=>x.id===c.pid);return{'التاريخ':c.date,'الشريك':p?.name||c.pid,'المبلغ':+c.amount||0,'الوصف':c.note||''};}));

  // Sheet 7: Partner Summary
  const fin=calcFin(sales,expenses,withdrawals,returns);
  add('ملخص الصناديق',fin.partners.map(p=>{
    const cap=capital.filter(c=>c.pid===p.id).reduce((a,x)=>a+(x.amount||0),0);
    return{'الشريك':p.name,'النسبة':`${(p.pct*100).toFixed(0)}%`,'رأس المال':+cap.toFixed(2),'حصة من الأرباح':+p.share.toFixed(2),'إجمالي السحوبات':+p.drawn.toFixed(2),'الرصيد الإجمالي':+(cap+p.share-p.drawn).toFixed(2)};
  }));

  // Sheet 7b: Returns
  add('المرتجعات',[...returns].sort((a,b)=>a.date.localeCompare(b.date)).map(r=>({'التاريخ':r.date,'السبب':r.reason||'','ملاحظة':r.note||'','إجمالي المسترد':+r.totalRefund||0,'التكلفة المُعادة':+r.totalCost||0,'الأصناف':(r.items||[]).map(it=>it.pname+' ×'+it.qty).join(' · ')})));

  // Sheet 8: Monthly P&L
  const allYrs=[...new Set([...sales,...expenses].map(x=>(x.date||'').slice(0,4)).filter(Boolean))];
  if(!allYrs.length)allYrs.push(String(new Date().getFullYear()));
  const monthly=[];
  allYrs.sort().forEach(yr=>{
    for(let m=1;m<=12;m++){
      const mKey=`${yr}-${String(m).padStart(2,'0')}`;
      const mf=calcFin(sales,expenses,withdrawals,returns,mKey);
      if(mf.totalSales>0||mf.fuel+mf.other>0)
        monthly.push({'السنة':yr,'الشهر':MN[m-1],'المبيعات':+mf.totalSales.toFixed(2),'تكلفة البضاعة':+mf.totalCost.toFixed(2),'إجمالي الربح':+mf.gross.toFixed(2),'مصاريف الوقود':+mf.fuel.toFixed(2),'مصاريف أخرى':+mf.other.toFixed(2),'صافي الربح':+mf.net.toFixed(2),'م.خالد 40%':+(mf.net*.4).toFixed(2),'ع.سعيد 40%':+(mf.net*.4).toFixed(2),'السيارة 20%':+(mf.net*.2).toFixed(2)});
    }
  });
  add('الأرباح الشهرية',monthly);

  XLSX.writeFile(wb,`تقرير_دهانات_${today()}.xlsx`);
  notify('✅ تم تصدير Excel بنجاح!');
};

/* ══ SETUP SCREEN ══════════════════════════════ */
function SetupScreen({onDone}){
  const[tok,setTok]=useState('');const[err,setErr]=useState('');const[loading,setLoading]=useState(false);
  const doSetup=async()=>{
    if(!tok.trim()){setErr('أدخل الرمز أولاً');return;}
    setLoading(true);setErr('');
    setToken(tok.trim());
    try{await ghRead();onDone();}
    catch(e){setErr('الرمز غير صحيح أو انتهت صلاحيته.');localStorage.removeItem(TOKEN_KEY);}
    finally{setLoading(false);}
  };
  return(<div className="setup-bg"><div className="setup-card">
    <div style={{textAlign:'center',marginBottom:20}}>
      <div style={{fontSize:44}}>🎨</div>
      <h2 style={{fontSize:18,fontWeight:900,color:'#1E293B',margin:'6px 0 4px'}}>دهانات ومستلزمات البناء</h2>
      <p style={{fontSize:12,color:'#94A3B8'}}>أدخل رمز الاتصال لتفعيل المزامنة السحابية</p>
    </div>
    <div style={{background:'#F0FDF4',borderRadius:12,padding:'14px 16px',marginBottom:16,border:'1px solid #A7F3D0'}}>
      <div style={{fontWeight:700,color:'#047857',fontSize:13,marginBottom:6}}>📌 الإعداد الأول فقط:</div>
      <div style={{fontSize:13,color:'#065F46',lineHeight:1.8}}>١. اطلب رمز الاتصال من محمد خالد<br/>٢. الصقه في الحقل أدناه<br/>٣. يُحفظ تلقائياً على هذا الجهاز</div>
    </div>
    <div className="fg" style={{marginBottom:12}}>
      <label>رمز الاتصال (يبدأ بـ ghp_)</label>
      <input className="fc" type="password" value={tok} onChange={e=>{setTok(e.target.value);setErr('');}} placeholder="ghp_..." onKeyDown={e=>e.key==='Enter'&&doSetup()} style={{direction:'ltr',textAlign:'left'}}/>
    </div>
    {err&&<div style={{background:'#FEF2F2',border:'1px solid #FECACA',color:'#DC2626',borderRadius:9,padding:'8px 12px',fontSize:13,marginBottom:10}}>{err}</div>}
    <button className="btn bp blg" onClick={doSetup} disabled={loading} style={{opacity:loading?.6:1}}>{loading?'⏳ جاري التحقق...':'✅ اتصل وابدأ'}</button>
  </div></div>);
}

/* ══ LOGIN ══════════════════════════════════════ */
function LoginScreen({onLogin,cfgPwds}){
  const[sel,setSel]=useState(null);const[pwd,setPwd]=useState('');const[err,setErr]=useState('');
  const defs={mk:{name:'محمد خالد',color:'#1D4ED8',bg:'#EFF6FF',ico:'👨‍💼',role:'مدير — صلاحيات كاملة'},as:{name:'علي سعيد',color:'#047857',bg:'#ECFDF5',ico:'👷',role:'موظف مبيعات'}};
  const doLogin=()=>{
    if(!sel){setErr('اختر حسابك أولاً');return;}
    const expected=cfgPwds[sel]||{mk:'1234',as:'5678'}[sel];
    if(pwd===expected)onLogin({id:sel,...defs[sel],role:sel==='mk'?'admin':'sales'});
    else{setErr('كلمة المرور غير صحيحة');setPwd('');}
  };
  return(<div className="login-bg"><div className="login-card">
    <div style={{textAlign:'center',marginBottom:22}}>
      <div style={{fontSize:48,marginBottom:6}}>🎨</div>
      <h1 style={{fontSize:19,fontWeight:900,color:'#1E293B'}}>دهانات ومستلزمات البناء</h1>
      <p style={{fontSize:12,color:'#94A3B8',marginTop:4}}>نظام المحاسبة مع المزامنة السحابية ☁️</p>
    </div>
    <p style={{fontSize:13,fontWeight:700,color:'#475569',marginBottom:10}}>اختر حسابك:</p>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10,marginBottom:16}}>
      {Object.entries(defs).map(([id,u])=>(<button key={id} className={`upick sel-${sel===id?id:''}`} onClick={()=>{setSel(id);setErr('');}}>
        <div style={{fontSize:26,marginBottom:5}}>{u.ico}</div>
        <div style={{fontSize:14,fontWeight:800,color:sel===id?u.color:'#1E293B'}}>{u.name}</div>
        <div style={{fontSize:11,color:sel===id?u.color:'#94A3B8',marginTop:2}}>{u.role}</div>
      </button>))}
    </div>
    <Inp label="كلمة المرور" type="password" value={pwd} onChange={e=>{setPwd(e.target.value);setErr('');}} onKeyDown={e=>e.key==='Enter'&&doLogin()} placeholder="أدخل كلمة المرور"/>
    {err&&<div style={{color:'#DC2626',fontSize:13,textAlign:'center',marginTop:8}}>{err}</div>}
    <button className="btn bp blg" onClick={doLogin} style={{marginTop:14}}>تسجيل الدخول ←</button>
    <div style={{marginTop:12,padding:'8px 12px',background:'#F8FAFC',borderRadius:9,fontSize:12,color:'#64748B',textAlign:'center'}}>📌 م.خالد: <strong>1234</strong> · ع.سعيد: <strong>5678</strong></div>
  </div></div>);
}

/* ══ PRODUCTS ════════════════════════════════════ */
function Products({products,onWrite}){
  const{user}=useContext(AuthCtx);const isAdmin=user.role==='admin';
  const empty={name:'',cat:CATS[0],unit:'قطعة',buyP:'',sellP:'',stock:'',barcode:'',image:''};
  const[form,setForm]=useState(empty);const[editId,setEditId]=useState(null);const[q,setQ]=useState('');
  const s=k=>e=>setForm(p=>({...p,[k]:e.target.value}));
  const submit=()=>{if(!form.name||!form.sellP)return;const id=editId||uid();onWrite(data=>data.products[id]={...form,buyP:+form.buyP||0,sellP:+form.sellP||0,stock:+form.stock||0,id});setForm(empty);setEditId(null);notify('✅ تمت الإضافة — ستظهر في القائمة خلال ثوانٍ');};
  const filtered=products.filter(p=>!q||p.name.includes(q)||p.cat.includes(q));
  return(<div>
    <h2 style={{fontSize:20,fontWeight:900,marginBottom:4}}>📦 المنتجات</h2><p style={{fontSize:13,color:'#94A3B8',marginBottom:14}}>{products.length} منتج</p>
    <div className="card" style={{border:editId?'2px solid #93C5FD':'1px solid #E8EEF4'}}>
      <div style={{fontWeight:800,fontSize:14,marginBottom:12}}>{editId?'✏️ تعديل':'➕ إضافة منتج'}</div>
      <div className="fgrid">
        <Inp label="الاسم" req value={form.name} onChange={s('name')} placeholder="اسم المنتج"/>
        <Sel label="الفئة" value={form.cat} onChange={s('cat')}>{CATS.map(c=><option key={c}>{c}</option>)}</Sel>
        <Inp label="الوحدة" value={form.unit} onChange={s('unit')} placeholder="قطعة/لتر/كيلو"/>
        <div className="fg">
          <label>الباركود</label>
          <div style={{display:'flex',gap:6}}>
            <input className="fc" style={{flex:1,direction:'ltr'}} value={form.barcode} onChange={s('barcode')} placeholder="ادخل الباركود أو امسح"/>
            <button type="button" className="btn bg2" style={{padding:'8px 10px',flexShrink:0}} title="مسح الباركود" onClick={()=>{
              if(!('BarcodeDetector' in window)){alert('المتصفح لا يدعم المسح التلقائي، أدخله يدوياً');return;}
              const vid=document.createElement('video');const cnv=document.createElement('canvas');
              navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(stream=>{
                vid.srcObject=stream;vid.play();
                const bd=new BarcodeDetector();
                const scan=()=>requestAnimationFrame(async()=>{
                  if(vid.readyState===4){
                    cnv.width=vid.videoWidth;cnv.height=vid.videoHeight;
                    cnv.getContext('2d').drawImage(vid,0,0);
                    try{const r=await bd.detect(cnv);if(r.length>0){setForm(p=>({...p,barcode:r[0].rawValue}));stream.getTracks().forEach(t=>t.stop());notify('✅ تم مسح الباركود: '+r[0].rawValue);return;}}
                    catch(e){}
                  }scan();
                });scan();
              }).catch(()=>notify('❌ تعذر فتح الكاميرا'));
            }}>📷</button>
          </div>
        </div>
        <div className="fg">
          <label>صورة المنتج</label>
          <div style={{display:'flex',gap:8,alignItems:'center',flexWrap:'wrap'}}>
            {form.image&&<img src={form.image} style={{width:52,height:52,borderRadius:8,objectFit:'cover',border:'2px solid #E2E8F0'}}/>}
            <label style={{flex:1,cursor:'pointer',background:'#F8FAFC',border:'1.5px dashed #CBD5E1',borderRadius:10,padding:'8px 12px',textAlign:'center',fontSize:13,color:'#64748B'}}>
              📷 اختر صورة
              <input type="file" accept="image/*" style={{display:'none'}} onChange={e=>{
                const file=e.target.files[0];if(!file)return;
                const reader=new FileReader();
                reader.onload=ev=>{
                  const img=new Image();img.onload=()=>{
                    const MAX=220;let w=img.width,h=img.height;
                    if(w>h&&w>MAX){h=h*MAX/w;w=MAX;}else if(h>w&&h>MAX){w=w*MAX/h;h=MAX;}else if(w>MAX){w=h=MAX;}
                    const cnv=document.createElement('canvas');cnv.width=w;cnv.height=h;
                    cnv.getContext('2d').drawImage(img,0,0,w,h);
                    setForm(p=>({...p,image:cnv.toDataURL('image/jpeg',0.65)}));
                  };img.src=ev.target.result;
                };reader.readAsDataURL(file);
              }}/>
            </label>
            {form.image&&<button type="button" className="btn bd" style={{padding:'6px 10px',fontSize:12}} onClick={()=>setForm(p=>({...p,image:''}))}>✕</button>}
          </div>
        </div>
        <Inp label="سعر الشراء" type="number" value={form.buyP} onChange={s('buyP')} placeholder="0.00"/>
        <Inp label="سعر البيع ✶" req type="number" value={form.sellP} onChange={s('sellP')} placeholder="0.00"/>
        <Inp label="المخزون" type="number" value={form.stock} onChange={s('stock')} placeholder="0"/>
      </div>
      <div style={{display:'flex',gap:8}}><Btn onClick={submit}>{editId?'💾 حفظ':'➕ إضافة'}</Btn>{editId&&<Btn v="g" onClick={()=>{setForm(empty);setEditId(null);}}>إلغاء</Btn>}</div>
    </div>
    <div style={{marginBottom:12}}><Inp value={q} onChange={e=>setQ(e.target.value)} placeholder="🔍 بحث..." style={{maxWidth:260}}/></div>
    <div className="card"><div className="twrap"><table>
      <thead><tr><th></th><th>المنتج</th><th>الفئة</th><th>الوحدة</th><th>الباركود</th><th>سعر الشراء</th><th>سعر البيع</th><th>المخزون</th>{isAdmin&&<th>هامش</th>}<th></th></tr></thead>
      <tbody>{filtered.length===0?<tr><td colSpan={8} style={{textAlign:'center',padding:28,color:'#94A3B8'}}>لا توجد منتجات</td></tr>
      :filtered.map(p=>{const m=p.buyP>0?((p.sellP-p.buyP)/p.buyP*100).toFixed(1)+'%':'—';return(<tr key={p.id}>
        <td style={{width:44}}>{p.image?<img src={p.image} style={{width:36,height:36,borderRadius:6,objectFit:'cover'}}/>:<span style={{fontSize:20}}>📦</span>}</td>
        <td style={{fontWeight:700}}>{p.name}</td><td><Badge>{p.cat}</Badge></td><td style={{color:'#64748B'}}>{p.unit}</td>
        <td style={{color:'#64748B',fontSize:12}}>{p.barcode||'—'}</td>
        <td style={{color:'#DC2626'}}>{fmt(p.buyP)}</td>
        <td style={{color:'#047857',fontWeight:700}}>{fmt(p.sellP)}</td><td>{p.stock}</td>{isAdmin&&<td style={{color:'#92400E'}}>{m}</td>}
        <td><div style={{display:'flex',gap:4}}>
          <Btn v="g" style={{padding:'4px 8px',fontSize:12}} onClick={()=>{setForm({name:p.name,cat:p.cat,unit:p.unit,buyP:p.buyP,sellP:p.sellP,stock:p.stock,barcode:p.barcode||'',image:p.image||''});setEditId(p.id);window.scrollTo({top:0,behavior:'smooth'});}}>✏️ تعديل</Btn>
          {isAdmin&&<Btn v="d" style={{padding:'4px 8px',fontSize:12}} onClick={()=>{if(window.confirm('حذف؟')){onWrite(d=>delete d.products[p.id]);notify('🗑️ تم الحذف');}}}>🗑️</Btn>}
        </div></td>
      </tr>);})}</tbody>
    </table></div></div>
  </div>);
}

/* ══ SALES ════════════════════════════════════════ */
function Sales({sales,products,onWrite}){
  const{user}=useContext(AuthCtx);const isAdmin=user.role==='admin';
  const ei={pid:'',pname:'',qty:1,sellP:0,buyP:0,unit:''};
  const[date,setDate]=useState(today());const[note,setNote]=useState('');const[items,setItems]=useState([{...ei}]);const[filter,setFilter]=useState('');const[open,setOpen]=useState(false);const[editId,setEditId]=useState(null);
  const startEdit=s=>{setDate(s.date);setNote(s.note||'');setItems(s.items&&s.items.length?s.items:[{...ei}]);setEditId(s.id);setOpen(true);window.scrollTo({top:0,behavior:'smooth'});};
  const upd=(i,k,v)=>{const n=[...items];n[i]={...n[i],[k]:v};if(k==='pid'){const pr=products.find(p=>p.id===v);if(pr)n[i]={...n[i],pname:pr.name,sellP:pr.sellP,buyP:pr.buyP,unit:pr.unit};}setItems(n);};
  const totals=useMemo(()=>{const total=items.reduce((s,it)=>s+(+it.qty*(+it.sellP)||0),0);const cost=items.reduce((s,it)=>s+(+it.qty*(+it.buyP)||0),0);return{total,cost,profit:total-cost};},[items]);
  const doSave=()=>{
    if(!items.some(it=>it.pname||it.sellP>0))return;
    const id=editId||uid();
    onWrite(d=>{d.sales[id]={id,date,note,items,total:totals.total,cost:totals.cost,profit:totals.profit};});
    setItems([{...ei}]);setNote('');setDate(today());setOpen(false);setEditId(null);
    notify(editId?'✅ تم تعديل الفاتورة':'✅ تم حفظ الفاتورة');
  };
  const list=[...sales].filter(s=>!filter||s.date.startsWith(filter)).sort((a,b)=>b.date.localeCompare(a.date));
  return(<div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4,gap:8,flexWrap:'wrap'}}>
      <div><h2 style={{fontSize:20,fontWeight:900,marginBottom:4}}>💰 المبيعات</h2><p style={{fontSize:13,color:'#94A3B8',margin:0}}>{sales.length} فاتورة</p></div>
      <Btn onClick={()=>{setOpen(!open);if(open){setEditId(null);setItems([{...ei}]);setNote('');setDate(today());}}}>{open?(editId?'✕ إلغاء التعديل':'✕ إغلاق'):'➕ فاتورة جديدة'}</Btn>
    </div>
    {open&&<div className="card" style={{marginTop:12,border:'2px solid #93C5FD'}}>
      <div style={{fontWeight:800,fontSize:14,marginBottom:12}}>{editId?'✏️ تعديل الفاتورة':'🧾 فاتورة جديدة'}</div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 2fr',gap:10,marginBottom:12}}>
        <Inp label="التاريخ" type="date" value={date} onChange={e=>setDate(e.target.value)}/>
        <Inp label="ملاحظة/العميل" value={note} onChange={e=>setNote(e.target.value)} placeholder="اسم العميل"/>
      </div>
      {items.map((item,i)=>(<div key={i} style={{display:'grid',gridTemplateColumns:'2fr 70px 100px 70px auto',gap:8,marginBottom:8,alignItems:'end'}}>
        <Sel value={item.pid} onChange={e=>upd(i,'pid',e.target.value)}><option value="">-- اختر منتج --</option>{products.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}</Sel>
        <Inp type="number" value={item.qty} onChange={e=>upd(i,'qty',+e.target.value)} placeholder="كمية"/>
        <Inp type="number" value={item.sellP} onChange={e=>upd(i,'sellP',+e.target.value)} placeholder="سعر البيع"/>
        <div style={{padding:'9px 8px',background:'#ECFDF5',borderRadius:10,border:'1.5px solid #A7F3D0',fontSize:12,fontWeight:700,color:'#047857',textAlign:'center'}}>{fmt(+item.qty*+item.sellP)}</div>
        {items.length>1&&<Btn v="d" style={{padding:'8px 10px'}} onClick={()=>setItems(items.filter((_,idx)=>idx!==i))}>✕</Btn>}
      </div>))}
      <Btn v="g" style={{marginBottom:12,fontSize:13}} onClick={()=>setItems([...items,{...ei}])}>＋ صنف</Btn>
      <div style={{background:'#F0FDF4',borderRadius:10,padding:'10px 14px',marginBottom:12,display:'flex',gap:20,flexWrap:'wrap',fontSize:13}}>
        <span>المجموع: <strong style={{color:'#047857'}}>{fmt(totals.total)} ر.س</strong></span>
        <span>التكلفة: <strong style={{color:'#DC2626'}}>{fmt(totals.cost)} ر.س</strong></span>
        {isAdmin&&<span>الربح: <strong style={{color:'#1D4ED8'}}>{fmt(totals.profit)} ر.س</strong></span>}
      </div>
      <Btn v="s" onClick={doSave}>{editId?'💾 حفظ التعديل':'✅ حفظ الفاتورة'}</Btn>
    </div>}
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',margin:'14px 0 10px',gap:8,flexWrap:'wrap'}}>
      <span style={{fontWeight:700,fontSize:14}}>السجل ({list.length})</span>
      <Inp type="month" value={filter} onChange={e=>setFilter(e.target.value)} style={{width:'auto'}}/>
    </div>
    <div className="card">{list.length===0?<div style={{textAlign:'center',padding:28,color:'#94A3B8'}}>لا توجد مبيعات</div>
    :list.map(s=>(<div key={s.id} style={{borderBottom:'1px solid #F1F5F9',padding:'10px 0'}}>
      <div style={{display:'flex',justifyContent:'space-between',gap:8,flexWrap:'wrap'}}>
        <div><div style={{fontWeight:700,fontSize:14}}>🧾 {s.note||'مبيعات'}</div><div style={{fontSize:11,color:'#94A3B8',margin:'3px 0'}}>{s.date}</div>
          {s.items?.length>0&&<div style={{fontSize:12,color:'#64748B'}}>{s.items.map(it=>`${it.pname||'منتج'} ×${it.qty}`).join(' · ')}</div>}
        </div>
        <div style={{textAlign:'left'}}>
          <div style={{fontWeight:900,fontSize:17,color:'#047857'}}>{fmt(s.total)} ر.س</div>
          {isAdmin&&<div style={{fontSize:11,color:'#64748B'}}>ربح: {fmt(s.profit)}</div>}
          {isAdmin&&<Btn v="d" style={{padding:'3px 10px',fontSize:12,marginTop:6}} onClick={()=>{if(window.confirm('حذف؟')){onWrite(d=>delete d.sales[s.id]);notify('🗑️ تم الحذف');}}}>🗑️</Btn>}
            <Btn v="g" style={{padding:'3px 10px',fontSize:12,marginTop:6}} onClick={()=>startEdit(s)}>✏️ تعديل</Btn>
        </div>
      </div>
    </div>))}</div>
  </div>);
}

/* ══ EXPENSES ════════════════════════════════════ */
function Expenses({expenses,onWrite}){
  const{user}=useContext(AuthCtx);const isAdmin=user.role==='admin';
  const[form,setForm]=useState({date:today(),type:'other',desc:'',amount:''});const[filter,setFilter]=useState('');

        <div style={{background:'#F8FAFC',padding:'5px 12px',borderRadius:8,fontSize:12}}>📝 {fmt(tOther)}</div>
      </div>}

    </div>

/* ══ P&L ════════════════════════════════════════ */
function PL({sales,expenses,withdrawals,capital,returns=[]}){
  const cy=String(new Date().getFullYear());const[year,setYear]=useState(cy);
  const months=Array.from({length:12},(_,i)=>`${year}-${String(i+1).padStart(2,'0')}`);
  const mData=useMemo(()=>months.map(m=>({key:m,...calcFin(sales,expenses,withdrawals,returns,m)})),[sales,expenses,withdrawals,returns,year]);
  const tot=useMemo(()=>({totalSales:mData.reduce((s,m)=>s+m.totalSales,0),totalCost:mData.reduce((s,m)=>s+m.totalCost,0),gross:mData.reduce((s,m)=>s+m.gross,0),fuel:mData.reduce((s,m)=>s+m.fuel,0),other:mData.reduce((s,m)=>s+m.other,0),net:mData.reduce((s,m)=>s+m.net,0)}),[mData]);
  const aP=useMemo(()=>PARTNERS.map(p=>{
    const share=tot.net*p.pct;
    const drawn=withdrawals.filter(w=>w.pid===p.id&&(w.date||'').startsWith(year)).reduce((s,w)=>s+w.amount,0);
    const cap=capital.filter(c=>c.pid===p.id&&(c.date||'').startsWith(year)).reduce((s,c)=>s+c.amount,0);
    return{...p,share,drawn,cap,roi:cap>0?(share/cap*100).toFixed(1):null};
  }),[tot.net,withdrawals,capital,year]);
  const years=useMemo(()=>{const all=[...sales,...expenses].map(x=>(x.date||'').slice(0,4)).filter(Boolean);return[...new Set(['2024','2025','2026',...all])].sort();},[sales,expenses]);
  return(<div>
    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:14,gap:8,flexWrap:'wrap'}}>
      <div><h2 style={{fontSize:20,fontWeight:900,marginBottom:4}}>📈 الأرباح والخسائر</h2><p style={{fontSize:13,color:'#94A3B8',margin:0}}>ملخص سنوي</p></div>
      <Sel value={year} onChange={e=>setYear(e.target.value)} style={{width:'auto'}}>{years.map(y=><option key={y}>{y}</option>)}</Sel>
    </div>
    <div className="kgrid">
      <KPI ico="💰" lbl="مبيعات السنة" val={`${fmt(tot.totalSales)} ر.س`} color="#047857" bg="#ECFDF5"/>
      <KPI ico="💹" lbl="إجمالي الربح" val={`${fmt(tot.gross)} ر.س`} color="#1D4ED8" bg="#EFF6FF"/>
      <KPI ico="💸" lbl="إجمالي المصاريف" val={`${fmt(tot.fuel+tot.other)} ر.س`} color="#DC2626" bg="#FEF2F2"/>
      <KPI ico="✅" lbl="صافي الربح" val={`${fmt(tot.net)} ر.س`} color={tot.net>=0?'#047857':'#DC2626'} bg={tot.net>=0?'#ECFDF5':'#FEF2F2'}/>
    </div>

let _dRBuf = [];  // module-level buffer for Dahhanat returns

function Returns({returns,products,sales,onWrite}){
  const{user}=useContext(AuthCtx);const isAdmin=user.role==='admin';
  const[date,setDate]=useState(today());
  const[note,setNote]=useState('');
  const[reason,setReason]=useState('تالف أو معيب');
  const[items,setItems]=useState([]);
  const[selPid,setSelPid]=useState('');
  const[selQty,setSelQty]=useState(1);
  const[selPrice,setSelPrice]=useState('');
  const[open,setOpen]=useState(false);
  const REASONS=['تالف أو معيب','خطأ في الطلب','لم يعجب العميل','مشكلة في الجودة','أخرى'];

  const addItem=()=>{
    if(!selPid||!selQty)return;
    const pr=products.find(p=>p.id===selPid);if(!pr)return;
    const p2=+selPrice||pr.sellP||0;
    _dRBuf=[..._dRBuf,{pid:pr.id,pname:pr.name,qty:+selQty||1,sellP:p2,cost:+pr.buyP||0}];
    setItems([..._dRBuf]);
    setSelPid('');setSelQty(1);setSelPrice('');
  };
  const removeItem=i=>{_dRBuf=_dRBuf.filter((_,j)=>j!==i);setItems([..._dRBuf]);};

  const totalRefund=items.reduce((s,it)=>s+(it.qty*(it.sellP||0)),0);
  const totalCost=items.reduce((s,it)=>s+(it.qty*(it.cost||0)),0);

  const doSave=()=>{
    if(!items.length)return;
    const _id=uid();
    const _date=date,_note=note,_reason=reason;
    const _items=[..._dRBuf];
    const _ref=totalRefund,_cst=totalCost;
    onWrite(d=>{
      // ✅ حفظ المرتجع
      d.returns[_id]={id:_id,date:_date,note:_note,reason:_reason,items:_items,totalRefund:_ref,totalCost:_cst};
      // 📦 إعادة المخزون
      _items.forEach(it=>{if(it.pid&&d.products[it.pid])d.products[it.pid].stock=(Number(d.products[it.pid].stock)||0)+Number(it.qty||0);});
    });
    // reset
    _dRBuf=[];setItems([]);setNote('');setDate(today());setReason('تالف أو معيب');setOpen(false);
    notify('✅ تم تسجيل المرتجع وإعادة '+_items.length+' صنف للمخزون');
  };

  const delReturn=r=>{
    if(!window.confirm('حذف المرتجع؟ سيُخصم المخزون مجدداً'))return;
    onWrite(d=>{
      const ret=d.returns[r.id];
      if(ret)(ret.items||[]).forEach(it=>{if(it.pid&&d.products[it.pid])d.products[it.pid].stock=Math.max(0,(Number(d.products[it.pid].stock)||0)-Number(it.qty||0));});
      delete d.returns[r.id];
    });
    notify('🗑️ تم حذف المرتجع');
  };

  const list=[...returns].sort((a,b)=>b.date.localeCompare(a.date));

  return(<div>
    <h2 style={{fontSize:20,fontWeight:900,marginBottom:4}}>↩️ المرتجعات</h2>
    <p style={{fontSize:13,color:'#94A3B8',marginBottom:14}}>تسجيل المرتجع يُعيد المخزون ويُعدّل أرقام المبيعات والأرباح تلقائياً</p>

    <div className="card" style={{background:'#FFF7ED',border:'1px solid #FED7AA',marginBottom:14}}>
      <div style={{fontWeight:700,fontSize:13,color:'#92400E',marginBottom:6}}>📌 كيف يعمل المرتجع؟</div>
      <div style={{fontSize:12,color:'#78350F',lineHeight:1.9}}>
        ✅ يُعيد الكمية للمخزون تلقائياً<br/>
        ✅ يُقلل إجمالي المبيعات في التقارير<br/>
        ✅ يُعدّل أرباح الشركاء تلقائياً
      </div>
    </div>

    <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
      <span style={{fontWeight:700,fontSize:14}}>المرتجعات ({list.length})</span>
      <Btn v="d" onClick={()=>{if(open){_dRBuf=[];setItems([]);}setOpen(v=>!v);}}>
        {open?'✕ إغلاق':'↩️ مرتجع جديد'}
      </Btn>
    </div>

    {open&&<div className="card" style={{border:'2px solid #FECACA',marginBottom:14}}>
      <div style={{fontWeight:800,fontSize:14,color:'#DC2626',marginBottom:12}}>↩️ تسجيل مرتجع جديد</div>
      <div className="fgrid" style={{marginBottom:12}}>
        <Inp label="التاريخ" type="date" value={date} onChange={e=>setDate(e.target.value)}/>
        <div className="fg"><label>سبب الإرجاع</label>
          <select className="fc" value={reason} onChange={e=>setReason(e.target.value)}>
            {REASONS.map(r=><option key={r}>{r}</option>)}
          </select>
        </div>
        <Inp label="اسم العميل / ملاحظة" value={note} onChange={e=>setNote(e.target.value)} placeholder="اختياري"/>
      </div>

      <div style={{fontWeight:700,fontSize:13,color:'#475569',marginBottom:8}}>الأصناف المرتجعة:</div>
      <div style={{display:'grid',gridTemplateColumns:'2fr 70px 100px auto',gap:8,marginBottom:10,alignItems:'end'}}>
        <div className="fg"><label>المنتج</label>
          <select className="fc" value={selPid} onChange={e=>{setSelPid(e.target.value);const pr=products.find(p=>p.id===e.target.value);if(pr)setSelPrice(String(pr.sellP||''));}}>
            <option value="">-- اختر منتج --</option>
            {products.map(p=><option key={p.id} value={p.id}>{p.name}</option>)}
          </select>
        </div>
        <Inp label="الكمية" type="number" value={selQty} onChange={e=>setSelQty(+e.target.value)} placeholder="1"/>
        <Inp label="سعر البيع" type="number" value={selPrice} onChange={e=>setSelPrice(e.target.value)} placeholder="سعر الفاتورة الأصلي"/>
        <div className="fg"><label>&nbsp;</label><Btn v="d" style={{width:'100%'}} onClick={addItem}>＋ أضف</Btn></div>
      </div>

      {items.length>0&&<>
        <div style={{background:'#FEF2F2',borderRadius:10,border:'1px solid #FECACA',marginBottom:12}}>
          <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
            <thead><tr style={{background:'#DC2626',color:'white'}}>
              {['المنتج','الكمية','سعر البيع','إجمالي الاسترداد','التكلفة',''].map(t=><th key={t} style={{padding:'7px 10px',background:'#DC2626',color:'white',textAlign:'right'}}>{t}</th>)}
            </tr></thead>
            <tbody>{items.map((it,i)=>(
              <tr key={i} style={{borderBottom:'1px solid #FEE2E2'}}>
                <td style={{padding:'7px 10px',fontWeight:700}}>{it.pname}</td>
                <td style={{padding:'7px 10px',textAlign:'center'}}>{it.qty}</td>
                <td style={{padding:'7px 10px',color:'#64748B'}}>{fmt(it.sellP)}</td>
                <td style={{padding:'7px 10px',fontWeight:800,color:'#DC2626'}}>{fmt(it.qty*it.sellP)}</td>
                <td style={{padding:'7px 10px',color:'#94A3B8'}}>{fmt(it.qty*it.cost)}</td>
                <td style={{padding:'7px 10px'}}><Btn v="d" style={{padding:'3px 8px',fontSize:11}} onClick={()=>removeItem(i)}>✕</Btn></td>
              </tr>
            ))}</tbody>
          </table>
        </div>
        <div style={{display:'flex',gap:12,marginBottom:12,flexWrap:'wrap',fontSize:13}}>
          <span style={{background:'#FEF2F2',padding:'5px 12px',borderRadius:8,border:'1px solid #FECACA'}}>
            إجمالي المسترد: <strong style={{color:'#DC2626'}}>{fmt(totalRefund)} ر.س</strong>
          </span>
          <span style={{background:'#F8FAFC',padding:'5px 12px',borderRadius:8,border:'1px solid #E2E8F0'}}>
            التكلفة المُعادة: <strong style={{color:'#047857'}}>{fmt(totalCost)} ر.س</strong>
          </span>
        </div>
        <Btn v="d" onClick={doSave}>💾 تسجيل المرتجع وإعادة المخزون</Btn>
      </>}
    </div>}

    {list.length===0?<div className="card" style={{textAlign:'center',padding:32,color:'#94A3B8'}}>لا توجد مرتجعات مسجّلة</div>
    :list.map(r=>(
      <div key={r.id} className="card" style={{border:'1px solid #FECACA'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:8,flexWrap:'wrap'}}>
          <div>
            <div style={{fontWeight:800,fontSize:14,color:'#DC2626'}}>↩️ {r.reason||'مرتجع'}</div>
            <div style={{fontSize:12,color:'#94A3B8',margin:'3px 0'}}>{r.date}{r.note&&` — ${r.note}`}</div>
            <div style={{fontSize:12,color:'#64748B'}}>{(r.items||[]).map(it=>`${it.pname} ×${it.qty}`).join(' · ')}</div>
          </div>
          <div style={{display:'flex',alignItems:'center',gap:10}}>
            <div style={{textAlign:'left'}}>
              <div style={{fontWeight:800,color:'#DC2626',fontSize:15}}>{fmt(r.totalRefund)} ر.س</div>
              <div style={{fontSize:11,color:'#94A3B8'}}>تكلفة: {fmt(r.totalCost)}</div>
            </div>
            {isAdmin&&<Btn v="d" style={{padding:'4px 10px',fontSize:12}} onClick={()=>delReturn(r)}>🗑️</Btn>}
          </div>
        </div>
      </div>
    ))}

    {isAdmin&&list.length>0&&<div className="card" style={{background:'#F0FDF4',border:'1px solid #A7F3D0'}}>
      <div style={{fontWeight:700,fontSize:13,color:'#047857',marginBottom:8}}>📊 ملخص المرتجعات</div>
      <div style={{display:'flex',gap:12,flexWrap:'wrap',fontSize:13}}>
        <span>عدد المرتجعات: <strong>{list.length}</strong></span>
        <span>إجمالي المسترد: <strong style={{color:'#DC2626'}}>{fmt(list.reduce((s,r)=>s+(r.totalRefund||0),0))} ر.س</strong></span>
        <span>التكلفة المُعادة للمخزون: <strong style={{color:'#047857'}}>{fmt(list.reduce((s,r)=>s+(r.totalCost||0),0))} ر.س</strong></span>
      </div>
    </div>}
  </div>);
}

/* ══ MAIN APP ══════════════════════════════════════ */
function App(){
  const[user,setUser]=useState(()=>{try{const u=sessionStorage.getItem('pnt_u');return u?JSON.parse(u):null;}catch{return null;}});
  const[tab,setTab]=useState(0);
  const[products,setProducts]=useState([]);const[sales,setSales]=useState([]);
  const[expenses,setExpenses]=useState([]);const[withdrawals,setWithdrawals]=useState([]);
  const[capital,setCapital]=useState([]);const[returns,setReturns]=useState([]);
  const[cfgPwds,setCfgPwds]=useState({mk:'1234',as:'5678'});
  const[syncState,setSyncState]=useState('loading');const[lastTs,setLastTs]=useState(0);
  const[moreOpen,setMoreOpen]=useState(false);const[hasToken,setHasToken]=useState(!!getToken());

  const applyData=(data)=>{
    setProducts(Object.values(data.products||{}));setSales(Object.values(data.sales||{}));
    setExpenses(Object.values(data.expenses||{}));setWithdrawals(Object.values(data.withdrawals||{}));
    setCapital(Object.values(data.capital||{}));setReturns(Object.values(data.returns||{}));
    setCfgPwds({mk:data.config?.pwd_mk||'1234',as:data.config?.pwd_as||'5678'});
    setLastTs(data.ts||0);
  };

  useEffect(()=>{
    if(!getToken()){setSyncState('notoken');return;}
    ghRead().then(data=>{applyData(data);setSyncState('ok');}).catch(()=>setSyncState('err'));
    // Auto-retry on mobile if stuck after 20s
    const autoRetry=setTimeout(()=>{
      if(syncState==='loading'){
        ghRead().then(data=>{applyData(data);setSyncState('ok');}).catch(()=>setSyncState('err'));
      }
    },20000);
    const poll=setInterval(()=>{
      ghRead().then(data=>{if((data.ts||0)>lastTs){applyData(data);notify('🔄 تم تحديث البيانات');}setSyncState('ok');}).catch(()=>setSyncState('err'));
    },30000);
    return()=>clearInterval(poll);
  },[hasToken]);

  const onWrite=useCallback((updater)=>{
    setSyncState('busy');
    ghWrite(updater).then(data=>{applyData(data);setSyncState('ok');}).catch(()=>{setSyncState('err');notify('❌ خطأ في الحفظ، حاول مجدداً');});
  },[lastTs]);

  const handleLogin=u=>{setUser(u);sessionStorage.setItem('pnt_u',JSON.stringify(u));setTab(u.role==='admin'?0:2);};
  const handleLogout=()=>{sessionStorage.removeItem('pnt_u');setUser(null);};
  const onExcel=()=>exportExcel(products,sales,expenses,withdrawals,capital,returns);

  const partnerBal=useMemo(()=>{
    const fin=calcFin(sales,expenses,withdrawals,returns);
    return PARTNERS.map(p=>{
      const pd=fin.partners.find(x=>x.id===p.id);
      const capTotal=capital.filter(c=>c.pid===p.id).reduce((a,x)=>a+(x.amount||0),0);
      const share=pd?.share||0;const drawn=pd?.drawn||0;
      return{...p,share,drawn,capTotal,netBalance:capTotal+share-drawn};
    });
  },[sales,expenses,withdrawals,capital]);

  if(syncState==='notoken'||!hasToken)return<SetupScreen onDone={()=>{setHasToken(true);setSyncState('loading');}}/>;
  if(syncState==='err')return(<div className="splash">
    <div style={{fontSize:40,marginBottom:12}}>⚠️</div>
    <div style={{fontWeight:800,fontSize:16,color:'#DC2626',marginBottom:8}}>تعذّر الاتصال بالخادم</div>
    <div style={{fontSize:13,color:'#64748B',marginBottom:20}}>تحقق من الإنترنت ثم أعد المحاولة</div>
    <button className="btn bp" onClick={()=>{setSyncState('loading');ghRead().then(d=>{applyData(d);setSyncState('ok');}).catch(()=>setSyncState('err'));}} style={{padding:'10px 24px',fontSize:14}}>🔄 إعادة المحاولة</button>
  </div>);
  if(syncState==='loading')return<div className="splash"><div className="splash-icon">🎨</div><div style={{fontSize:16,fontWeight:800,color:'#1D4ED8'}}>جاري تحميل البيانات...</div></div>;
  if(!user)return<LoginScreen onLogin={handleLogin} cfgPwds={cfgPwds}/>;

  const TABS=user.role==='admin'?ADMIN_TABS:SALES_TABS;
  const isAdmin=user.role==='admin';
  const bottomTabs=TABS.slice(0,5);const moreTabs=TABS.slice(5);
  const goTab=id=>{setTab(id);setMoreOpen(false);};
  const syncLabel={ok:'متزامن ☁️',busy:'جاري الحفظ...',err:'خطأ في الاتصال'};

  const renderContent=()=>{
    switch(tab){
      case 0:return isAdmin?<Dashboard sales={sales} expenses={expenses} withdrawals={withdrawals} capital={capital} returns={returns} partnerBal={partnerBal} onExcel={onExcel}/>:null;
      case 1:return<Products products={products} onWrite={onWrite}/>;
      case 2:return<Sales sales={sales} products={products} onWrite={onWrite}/>;
      case 3:return<Expenses expenses={expenses} onWrite={onWrite}/>;
      case 4:return<Safes withdrawals={withdrawals} partnerBal={partnerBal} onWrite={onWrite}/>;
      case 5:return isAdmin?<MonthlyReport sales={sales} expenses={expenses} withdrawals={withdrawals} returns={returns}/>:null;
      case 6:return isAdmin?<PL sales={sales} expenses={expenses} withdrawals={withdrawals} capital={capital} returns={returns}/>:null;
      case 7:return isAdmin?<Settings onLogout={handleLogout} onWrite={onWrite} products={products} sales={sales} expenses={expenses} withdrawals={withdrawals} capital={capital} cfgPwds={cfgPwds} onExcel={onExcel}/>:null;
      case 8:return isAdmin?<Capital capital={capital} partnerBal={partnerBal} onWrite={onWrite}/>:null;
      case 9:return<Returns returns={returns} products={products} sales={sales} onWrite={onWrite}/>;
      default:return null;
    }
  };

  return(<AuthCtx.Provider value={{user}}>
    <header className="app-header"><div className="hinner">
      <div className="hrow">
        <div style={{display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:22}}>🎨</span>
          <div>
            <div style={{fontWeight:900,fontSize:15,lineHeight:1.2}}>دهانات ومستلزمات البناء</div>
            <div style={{fontSize:11,opacity:.85,display:'flex',alignItems:'center',gap:4}}>
              {user.name} · {isAdmin?'مدير':'موظف'}
              <span className={`sync-dot ${syncState}`}></span>
              <span style={{fontSize:10}}>{syncLabel[syncState]||''}</span>
            </div>
          </div>
        </div>
        <button onClick={handleLogout} style={{background:'rgba(255,255,255,.18)',border:'none',color:'white',padding:'6px 12px',borderRadius:8,cursor:'pointer',fontFamily:"'Cairo',sans-serif",fontSize:12}}>خروج</button>
      </div>
      <div className="dtabs">{TABS.map(t=><button key={t.id} className={`dtab ${tab===t.id?'act':''}`} onClick={()=>setTab(t.id)}>{t.ico} {t.lbl}</button>)}</div>
    </div></header>
    <div className="content">{renderContent()}</div>
    {isAdmin&&<button className="excel-fab" onClick={onExcel}>📊 Excel</button>}
    {moreTabs.length>0&&<><div className={`mov ${moreOpen?'open':''}`} onClick={()=>setMoreOpen(false)}/><div className={`mmenu ${moreOpen?'open':''}`}>{moreTabs.map(t=><button key={t.id} className={`mmi ${tab===t.id?'act':''}`} onClick={()=>goTab(t.id)}><span>{t.ico}</span>{t.lbl}</button>)}</div></>}
    <nav className="bnav">
      {bottomTabs.map(t=><button key={t.id} className={`bni ${tab===t.id?'act':''}`} onClick={()=>setTab(t.id)}><span className="ico">{t.ico}</span>{t.lbl}</button>)}
      {moreTabs.length>0&&<button className={`bni ${moreTabs.some(t=>t.id===tab)||moreOpen?'act':''}`} onClick={()=>setMoreOpen(v=>!v)}><span className="ico">⋯</span>المزيد</button>}
    </nav>
  </AuthCtx.Provider>);
}

ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
<script>
// ── Manifest ─────────────────────────────────────────────────
const manifest={name:'دهانات',short_name:'دهانات',start_url:'.',display:'standalone',background_color:'#1D4ED8',theme_color:'#1D4ED8',lang:'ar',dir:'rtl',icons:[{src:`data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="#1D4ED8"/><text y="75" x="50" text-anchor="middle" font-size="62">🎨</text></svg>')}`,sizes:'any',type:'image/svg+xml'}]};
const mb=new Blob([JSON.stringify(manifest)],{type:'application/json'});
const ml=document.createElement('link');ml.rel='manifest';ml.href=URL.createObjectURL(mb);document.head.appendChild(ml);

// ── Service Worker: Network-First + Auto-Update ───────────────
if('serviceWorker' in navigator){
  const sw=`
const VER='pnt-v7';
// Delete old caches and take control immediately
self.addEventListener('install', e=>{
  self.skipWaiting();
  e.waitUntil(caches.open(VER).then(c=>c.add('/')));
});
self.addEventListener('activate', e=>{
  e.waitUntil(
    caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==VER).map(k=>caches.delete(k))))
    .then(()=>self.clients.claim())
  );
});
// Network first — always try network, fall back to cache
self.addEventListener('fetch', e=>{
  if(e.request.url.includes('api.github.com'))return; // never cache API calls
  e.respondWith(
    fetch(e.request).then(r=>{
      if(r&&r.status===200){const rc=r.clone();caches.open(VER).then(c=>c.put(e.request,rc));}
      return r;
    }).catch(()=>caches.match(e.request))
  );
});`;
  const blob=new Blob([sw],{type:'application/javascript'});
  navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(()=>{});
  // Force update check on every load
  navigator.serviceWorker.ready.then(reg=>reg.update()).catch(()=>{});
}
</script>
